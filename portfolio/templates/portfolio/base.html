{% load static %}
<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Portfolio{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tu CSS -->
  <link rel="stylesheet" href="{% static 'portfolio/css/site.css' %}">
</head>

<body class="bg-body">
  {% include "portfolio/partials/_navbar.html" %}

  <main class="container py-5">
    {% block content %}{% endblock %}
  </main>

  {% include "portfolio/partials/_footer.html" %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  (function () {
    const key = "theme";
    const saved = localStorage.getItem(key);
    const initial = saved ? saved : "dark";
    document.documentElement.setAttribute("data-bs-theme", initial);

    const btn = document.getElementById("themeToggle");
    const setLabel = () => {
      const t = document.documentElement.getAttribute("data-bs-theme");
      if (btn) btn.textContent = (t === "dark") ? "Claro" : "Oscuro";
    };

    window.toggleTheme = function () {
      const current = document.documentElement.getAttribute("data-bs-theme");
      const next = (current === "dark") ? "light" : "dark";
      document.documentElement.setAttribute("data-bs-theme", next);
      localStorage.setItem(key, next);
      setLabel();
    };

    setLabel();
  })();
</script>
</body>
</html>

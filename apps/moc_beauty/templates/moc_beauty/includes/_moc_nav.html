<nav class="moc-nav mb-4 {% if mode == 'bo' %}bo{% endif %}" aria-label="Navegación MOC Beauty">

  <a class="moc-logo" href="/moc-beauty/">
    <span class="moc-logo-mark">MOC</span>
    <span class="moc-logo-text">Beauty</span>
  </a>

  <div class="moc-nav-links">

    {% if mode != "bo" %}
      <!-- FRONT -->
      <a href="{% url 'moc_beauty:quienes_somos' %}">Quiénes somos</a>
      <a href="{% url 'moc_beauty:productos' %}">Productos</a>
      <a href="{% url 'moc_beauty:servicios' %}">Servicios</a>

      <a class="cta" href="{% url 'moc_beauty:pedir_cita' %}">
        Pedir cita
      </a>

      <div class="moc-icons">
        <a class="icon">IG</a>
        <a class="icon">FB</a>
        <a class="icon">WA</a>
      </div>

    {% else %}
      <!-- BACKOFFICE -->
      <span class="moc-bo-title">
        {{ bo_title|default:"Backoffice" }}
      </span>
    {% endif %}

    <!-- USUARIO (común) -->
    <div class="moc-user">

      {% if request.user.is_authenticated %}
        <span>{{ request.user.username }}</span>

        <a class="btn btn-sm btn-outline-secondary ms-2"
           href="{% url 'p_auth:logout' %}">
          Salir
        </a>
      {% else %}
        <a href="{% url 'p_auth:login' %}">Login</a>
      {% endif %}

    </div>

  </div>

</nav>

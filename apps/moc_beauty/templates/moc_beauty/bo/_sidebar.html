  </div>

  <nav class="moc-bo-nav" aria-label="Menú backoffice">
    <a
      href="{% url 'moc_beauty:dashboard' %}"
      class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">

    <a
